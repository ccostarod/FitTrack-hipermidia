<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Gerenciamento de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>FitTrack</h1>
            </div>
            <nav class="nav">
                <button class="btn-add-student">Adicionar Aluno</button>
            </nav>
        </div>
    </header>

    <div id="modal-add-student" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h1>Adicionar Novo Aluno</h1>
                <button class="btn-close-modal">&times;</button>
            </div>

            <form id="form-add-student" class="modal-form">
                <div class="form-group">
                    <label for="student-name">Nome Completo</label>
                    <input type="text" id="student-name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="student-phone">Telefone</label>
                    <input type="tel" id="student-phone" name="phone" required>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel">Cancelar</button>
                    <button type="submit" class="btn-submit">Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <main class="main-content">
    </main>

    <script src="script.js"></script>
</body>
</html>
