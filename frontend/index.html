<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitTrack - Gerenciamento de Alunos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header com o logo e botão de adicionar aluno -->
    <header class="header">
      <div class="container">
        <div class="logo">
          <h1>FitTrack</h1>
        </div>
        <nav class="nav">
          <button class="btn-add-student">Adicionar Aluno</button>
        </nav>
      </div>
    </header>

    <!-- Modal de adicionar/editar aluno, fica escondido até clicar no botão, e usamos o mesmo modal para ambos os casos (create e update) para não repetir código -->
    <div id="modal-add-student" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h1 id="modal-title">Adicionar Novo Aluno</h1>
          <button class="btn-close-modal">&times;</button>
        </div>

        <!-- Formulário de cadastro/edição do aluno -->
        <form id="form-add-student" class="modal-form">
          <!-- Campo hidden pra guardar o ID quando tiver editando -->
          <input type="hidden" id="student-id" name="id" />
          <div class="form-group">
            <label for="student-name">Nome Completo</label>
            <input type="text" id="student-name" name="name" required />
          </div>

          <!-- Usamos form-row pra colocar dois campos lado a lado -->
          <div class="form-row">
            <div class="form-group">
              <label for="student-plan">Plano</label>
              <select id="student-plan" name="plano" required>
                <option value="Mensal">Mensal</option>
                <option value="Trimestral">Trimestral</option>
                <option value="Semestral">Semestral</option>
                <option value="Anual">Anual</option>
              </select>
            </div>
            <div class="form-group">
              <label for="student-objective">Objetivo</label>
              <input type="text" id="student-objective" name="objetivo" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="student-imc">IMC</label>
              <input
                type="number"
                id="student-imc"
                name="imc"
                step="0.1"
                min="10"
              />
            </div>
            <div class="form-group">
              <label for="student-freq">Freq. Semanal</label>
              <input
                type="number"
                id="student-freq"
                name="freqSemanal"
                min="0"
                max="7"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="student-due">Vencimento</label>
              <input type="date" id="student-due" name="vencimento" />
            </div>
            <div class="form-group checkbox-group">
              <label for="student-active">
                <input
                  type="checkbox"
                  id="student-active"
                  name="ativo"
                  checked
                />
                Ativo
              </label>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-cancel">Cancelar</button>
            <button type="submit" class="btn-submit">Adicionar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Seção de filtros - a gente colocou busca por nome (adição fora o que foi pedido no site), filtro por plano e por status -->
    <div class="container filters-wrapper">
      <div class="search-bar">
        <input
          type="text"
          id="search-input"
          placeholder="Buscar aluno por nome..."
        />
      </div>

      <div class="filters-section">
        <div class="filter-group">
          <label for="filter-plan">Filtrar por Plano:</label>
          <select id="filter-plan">
            <option value="">Todos</option>
            <option value="Mensal">Mensal</option>
            <option value="Trimestral">Trimestral</option>
            <option value="Semestral">Semestral</option>
            <option value="Anual">Anual</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-active">Status:</label>
          <select id="filter-active">
            <option value="">Todos</option>
            <option value="true">Ativos</option>
            <option value="false">Inativos</option>
          </select>
        </div>

        <div class="filter-group">
          <button id="btn-clear-filters" class="btn-clear-filters">
            Limpar Filtros
          </button>
        </div>
      </div>
    </div>

    <!-- Área principal onde os cards dos alunos vão aparecer -->
    <main class="main-content">
      <div id="students-list" class="students-grid">
        <!-- Os cards dos alunos são renderizados aqui pelo JavaScript -->
      </div>
    </main>

    <!-- Carrega primeiro o env.js pra ter a URL da API disponível -->
    <script src="env.js"></script>
    <script src="script.js"></script>
  </body>
</html>
