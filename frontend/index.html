<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitTrack - Gerenciamento de Alunos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="logo">
          <h1>FitTrack</h1>
        </div>
        <nav class="nav">
          <button class="btn-add-student">Adicionar Aluno</button>
        </nav>
      </div>
    </header>

    <div id="modal-add-student" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h1 id="modal-title">Adicionar Novo Aluno</h1>
          <button class="btn-close-modal">&times;</button>
        </div>

        <form id="form-add-student" class="modal-form">
          <input type="hidden" id="student-id" name="id" />
          <div class="form-group">
            <label for="student-name">Nome Completo</label>
            <input type="text" id="student-name" name="name" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="student-plan">Plano</label>
              <select id="student-plan" name="plano" required>
                <option value="Mensal">Mensal</option>
                <option value="Trimestral">Trimestral</option>
                <option value="Semestral">Semestral</option>
                <option value="Anual">Anual</option>
              </select>
            </div>
            <div class="form-group">
              <label for="student-objective">Objetivo</label>
              <select id="student-objective" name="objetivo" multiple>
                <option value="Hipertrofia">Hipertrofia</option>
                <option value="Emagrecimento">Emagrecimento</option>
                <option value="Condicionamento Físico">
                  Condicionamento Físico
                </option>
                <option value="Saúde e Bem-estar">Saúde e Bem-estar</option>
                <option value="Ganho de Força">Ganho de Força</option>
                <option value="Definição Muscular">Definição Muscular</option>
                <option value="Flexibilidade">Flexibilidade</option>
                <option value="Reabilitação">Reabilitação</option>
                <option value="Outro">Outro (digitar meu objetivo)</option>
              </select>
              <small class="hint-text"
                >Segure Shift para selecionar múltiplos</small
              >
            </div>
          </div>

          <div class="form-group hidden" id="custom-objective-group">
            <label for="student-custom-objective">Objetivo Personalizado</label>
            <input
              type="text"
              id="student-custom-objective"
              name="objetivoPersonalizado"
              placeholder="Digite seu objetivo específico..."
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="student-imc">IMC</label>
              <input
                type="number"
                id="student-imc"
                name="imc"
                step="0.1"
                min="10"
              />
            </div>
            <div class="form-group">
              <label for="student-freq">Freq. Semanal</label>
              <input
                type="number"
                id="student-freq"
                name="freqSemanal"
                min="0"
                max="7"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="student-due">Vencimento</label>
              <input type="date" id="student-due" name="vencimento" />
            </div>
            <div class="form-group checkbox-group">
              <label for="student-active">
                <input
                  type="checkbox"
                  id="student-active"
                  name="ativo"
                  checked
                />
                Ativo
              </label>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-cancel">Cancelar</button>
            <button type="submit" class="btn-submit">Adicionar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="container filters-wrapper">
      <div class="search-bar">
        <input
          type="text"
          id="search-input"
          placeholder="Buscar aluno por nome..."
        />
      </div>

      <div class="filters-section">
        <div class="filter-group">
          <label for="filter-plan">Filtrar por Plano:</label>
          <select id="filter-plan">
            <option value="">Todos</option>
            <option value="Mensal">Mensal</option>
            <option value="Trimestral">Trimestral</option>
            <option value="Semestral">Semestral</option>
            <option value="Anual">Anual</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-active">Status:</label>
          <select id="filter-active">
            <option value="">Todos</option>
            <option value="true">Ativos</option>
            <option value="false">Inativos</option>
          </select>
        </div>

        <div class="filter-group">
          <button id="btn-clear-filters" class="btn-clear-filters">
            Limpar Filtros
          </button>
        </div>
      </div>
    </div>

    <main class="main-content">
      <div id="students-list" class="students-grid">
        <!-- Students will be rendered here -->
      </div>
    </main>

    <script src="env.js"></script>
    <script src="script.js"></script>
  </body>
</html>
